{% extends "base.html" %}
{% block contenido %}
<p style="margin:0 0 12px;font-size:18px;font-weight:bold;color:#1E293B;">Nombre de usuario</p>
<p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#475569;">
  Hola {{ nombre_completo }}, este es el nombre de usuario asociado a tu cuenta RiobambaTour.
</p>
<table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 0 20px;">
  <tr>
    <td style="background:#EAF4EF;border:2px solid {{ color_primario }};border-radius:10px;padding:16px 24px;text-align:center;">
      <span style="font-size:20px;font-weight:bold;color:{{ color_primario }};">{{ username }}</span>
    </td>
  </tr>
</table>
<p style="margin:0;font-size:13px;color:#94A3B8;">
  Si no solicitaste este recordatorio, puedes ignorar este mensaje.
</p>
{% endblock %}
